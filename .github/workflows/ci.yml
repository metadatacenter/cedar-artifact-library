name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to develop publishes, so only ever cancel superseded
  # pull-request and manual runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Maven tests (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress --update-snapshots verify --settings .m2/travis-settings.xml

      # The shared corpus carries this library's output for every artifact, and the TypeScript
      # library's build compares its own output against those files. That comparison only means
      # anything while they are current: a change to a writer here, without a regeneration there,
      # leaves it measuring output this library no longer produces.
      - name: Check out the shared corpus
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-test-artifacts
          ref: develop
          path: cedar-test-artifacts

      - name: Verify the committed corpus fixtures are current
        run: >
          ./mvnw --batch-mode --no-transfer-progress test-compile exec:java
          --settings .m2/travis-settings.xml
          -Dexec.classpathScope=test
          -Dexec.mainClass=org.metadatacenter.artifacts.model.CorpusFixtureVerifier
          -Dexec.args=cedar-test-artifacts

      # Other repositories resolve this artifact from Nexus, so a merged change
      # is invisible to their builds until the snapshot is republished. Tests have
      # already run in the step above; this only uploads what they verified.
      - name: Publish the snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./mvnw --batch-mode --no-transfer-progress deploy -DskipTests --settings .m2/travis-settings.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn
