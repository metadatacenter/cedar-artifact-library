name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to develop publishes, so only ever cancel superseded
  # pull-request and manual runs.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: Maven tests (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BMIR_NEXUS_USERNAME: ${{ secrets.BMIR_NEXUS_USERNAME }}
      BMIR_NEXUS_PASSWORD: ${{ secrets.BMIR_NEXUS_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # setup-java's Maven cache restores only an exact match on the POMs, so a version bump, which
      # every release makes twice, started the build from an empty repository. Falling back to the
      # newest earlier cache keeps every third-party artifact the bump did not change.
      - name: Restore the Maven repository
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Run Maven verification
        run: ./mvnw --batch-mode --no-transfer-progress --update-snapshots verify --settings .m2/nexus-settings.xml

      # The shared corpus carries this library's output for every artifact, and the TypeScript
      # library's build compares its own output against those files. That comparison only means
      # anything while they are current: a change to a writer here, without a regeneration there,
      # leaves it measuring output this library no longer produces.
      - name: Check out the shared corpus
        uses: actions/checkout@v7
        with:
          repository: metadatacenter/cedar-test-artifacts
          ref: develop
          path: cedar-test-artifacts

      - name: Verify the committed corpus fixtures are current
        run: >
          ./mvnw --batch-mode --no-transfer-progress test-compile exec:java
          --settings .m2/nexus-settings.xml
          -Dexec.classpathScope=test
          -Dexec.mainClass=org.metadatacenter.artifacts.model.CorpusFixtureVerifier
          -Dexec.args=cedar-test-artifacts

      # A YAML round trip compares YAML with YAML, so a reader and a writer that agree on a wrong reading
      # of an absent key pass it. This writes every corpus artifact as JSON straight from its source and
      # again through this library's YAML, and holds the differences to the families the YAML form is
      # known to produce, case by case, as src/test/resources/concordance/corpus-yaml-trip.json declares.
      - name: Verify the corpus writes the same JSON through YAML
        run: >
          ./mvnw --batch-mode --no-transfer-progress test-compile exec:java
          --settings .m2/nexus-settings.xml
          -Dexec.classpathScope=test
          -Dexec.mainClass=org.metadatacenter.artifacts.model.CorpusYamlTripVerifier
          -Dexec.args=cedar-test-artifacts

      # The YAML reader refuses a key it does not read, and the TypeScript library's reader refuses keys
      # the same way, so the two accept the same documents only while they read the same keys. The
      # record of the keys this reader reads in every corpus document is what the TypeScript library
      # compares its own with; this keeps the record current.
      - name: Verify the YAML key vocabulary record is current
        run: >
          ./mvnw --batch-mode --no-transfer-progress test-compile exec:java
          --settings .m2/nexus-settings.xml
          -Dexec.classpathScope=test
          -Dexec.mainClass=org.metadatacenter.artifacts.model.reader.CorpusYamlKeyVerifier
          -Dexec.args=cedar-test-artifacts

      # Other repositories resolve this artifact from Nexus, so a merged change
      # is invisible to their builds until the snapshot is republished. Tests have
      # already run in the step above; this only uploads what they verified.
      - name: Publish the snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: ./mvnw --batch-mode --no-transfer-progress deploy -DskipTests --settings .m2/nexus-settings.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn

      # cedar-parent attaches JaCoCo to every test run, and each module that ran tests writes a
      # report: target/site/jacoco for Surefire suites and target/site/jacoco-it for Failsafe ones.
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: "**/target/site/jacoco*/**"
          if-no-files-found: warn
